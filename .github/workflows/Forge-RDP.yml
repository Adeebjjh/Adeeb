name: Tailscale RDP
run-name: RDP ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install coding agents
        run: |
          python -m pip install 'cryptography>=43,<47'
          if ($LASTEXITCODE -ne 0) { throw 'Cryptography installation failed' }
          npm install -g @anthropic-ai/claude-code @openai/codex
          if ($LASTEXITCODE -ne 0) { throw 'CLI installation failed' }
          $npmPrefix = npm prefix -g
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'CLAUDE_CODE_GIT_BASH_PATH=C:\Program Files\Git\bin\bash.exe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force
          netsh advfirewall firewall add rule name='RDP-Tailscale' dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
      - name: Create RDP User with Secure Password
        run: |
          $charSet = @{
            Upper = [char[]](65..90)
            Lower = [char[]](97..122)
            Number = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          New-LocalUser -Name 'RDP' -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP'
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP'
          "RDP_CREDS=User: RDP | Password: $password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Tailscale
        run: |
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi' -OutFile $installerPath
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw 'Tailscale installation failed' }
          Remove-Item $installerPath -Force
      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) { throw 'Add TAILSCALE_AUTH_KEY to Hh repository secrets' }
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=rdp-$env:GITHUB_RUN_ID --timeout=60s
          if ($LASTEXITCODE -ne 0) { throw 'Tailscale connection failed' }
          $tsIP = $null
          for ($attempt=0; $attempt -lt 10 -and -not $tsIP; $attempt++) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) { throw 'Tailscale IP not assigned' }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-NetFirewallRule -DisplayName 'RDP-Tailscale' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8787 -LocalAddress $tsIP -RemoteAddress '100.64.0.0/10'
      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
            Start-Sleep -Seconds 30
          }
      - name: Disconnect Tailscale
        if: always()
        run: |
          if (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") {
            & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
          }
          
